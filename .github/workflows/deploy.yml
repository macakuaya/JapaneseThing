# Builds the app and publishes it to GitHub Pages.
#
# One-time setup in the repo: Settings → Pages → Source → "GitHub Actions".
# Nothing is published until that is switched on and a push reaches main.
#
# BASE_PATH must match the repo name, because Pages serves a project site from
# https://<user>.github.io/<repo>/ rather than from the domain root.
#
# Action versions are kept current deliberately: the older majors bundled a
# Node 20 runtime, which the runners now refuse and silently force onto Node
# 24. That worked, but it meant every run was executing something other than
# what the action was tested against.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # So it can also be published without waiting for a push.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Node 24 ships npm 11, matching the toolchain the lockfile was written
      # with. On npm 10 the same lockfile fails `npm ci` with "Missing:
      # picomatch from lock file", because the two versions resolve that
      # transitive dependency differently.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Fail the deploy rather than shipping a broken deck.
      - run: npm test
      - run: npm run check

      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
