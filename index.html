<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#191918" />
    <meta name="description" content="Spaced repetition for vocabulary, grammar and expressions from class." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="icon.svg" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <title>語 · Japanese SRS</title>
    <!--
      A pinned theme has to be on <html> before the first paint, and the app's
      own modules run too late for that — you would see the wrong background
      flash first. Hence a few inline lines rather than an import: the setting
      is read straight out of the same key lib/storage.ts writes. No attribute
      is set for 'system', which is what leaves the OS in charge.
    -->
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('jt.v1.settings') || '{}').theme
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {
        /* first run, or storage blocked: the system theme is a fine answer */
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
